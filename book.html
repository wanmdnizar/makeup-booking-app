<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Session &amp; Check Booking</title>
  <style>
    :root {
      --bg: #fff5f8;
      --card: #ffffff;
      --ink: #231f20;
      --muted: #64748b;
      --accent: #b81d55;
      --accent-dark: #981b4a;
      --border: #fed0df;
      --soft: #ffe8ef;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-inner {
      max-width: 780px;
      margin: 0 auto;
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .brand {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .nav-actions {
      display: flex;
      gap: 0.5rem;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
      display: grid;
      gap: 1.25rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.25rem;
      box-shadow: 0 6px 20px rgba(184, 29, 85, 0.05);
    }

    h1, h2 {
      margin: 0 0 0.4rem;
    }

    p.muted {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.9rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.7rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      background: #fff;
      color: var(--ink);
    }

    input:focus, select:focus, textarea:focus {
      outline: 2px solid rgba(184, 29, 85, 0.25);
      border-color: var(--accent);
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 0.72rem 1.05rem;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-dark);
    }

    .btn-secondary {
      background: var(--soft);
      color: var(--accent-dark);
      border: 1px solid var(--border);
    }

    .summary-box {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 14px;
      background: var(--soft);
      font-size: 0.92rem;
    }

    .booking-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.95rem;
      margin-top: 0.75rem;
      background: #fff;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #fef3c7;
      color: #92400e;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-inner">
      <div class="brand">Session Booking</div>
      <div class="nav-actions">
        <button type="button" class="btn-secondary" id="tab-book-btn">Book Session</button>
        <button type="button" class="btn-secondary" id="tab-my-btn">My Booking</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Booking Request View -->
    <section id="view-book" class="card">
      <h1>Request a Booking</h1>
      <p class="muted">Fill out your session details below to generate a reference and save it to My Booking.</p>

      <form id="booking-form">
        <div class="grid-2">
          <div>
            <label for="client-name">Full Name *</label>
            <input id="client-name" type="text" required placeholder="Your name" />
          </div>
          <div>
            <label for="client-phone">Phone / WhatsApp *</label>
            <input id="client-phone" type="tel" required placeholder="012-345 6789" />
          </div>
          <div>
            <label for="package-select">Package *</label>
            <select id="package-select">
              <option value="Soft Glam|250">Soft Glam — RM 250</option>
              <option value="Full Glam|450">Full Glam — RM 450</option>
              <option value="Bridal Session|1200">Bridal Session — RM 1,200</option>
            </select>
          </div>
          <div>
            <label for="event-date">Event Date *</label>
            <input id="event-date" type="date" required />
          </div>
          <div>
            <label for="start-time">Start Time *</label>
            <input id="start-time" type="time" value="08:00" required />
          </div>
          <div>
            <label for="venue">Location / Venue *</label>
            <input id="venue" type="text" required placeholder="Venue or address" />
          </div>
        </div>

        <div style="margin-top: 0.9rem;">
          <label for="notes">Notes (Optional)</label>
          <textarea id="notes" rows="2" placeholder="Look preference, ready-by time, or special notes"></textarea>
        </div>

        <div style="margin-top: 1rem;">
          <button type="submit" class="btn-primary">Submit Request</button>
        </div>
      </form>

      <div id="confirmation-box" class="summary-box hidden" aria-live="polite"></div>
    </section>

    <!-- My Booking View -->
    <section id="view-my" class="card hidden">
      <h2>My Bookings</h2>
      <p class="muted">Bookings submitted on this browser appear below. You can also look up a booking by reference.</p>

      <div id="saved-bookings-list"></div>

      <hr style="border: 0; border-top: 1px solid var(--border); margin: 1.25rem 0;" />

      <h3>Find by Booking Reference</h3>
      <div class="grid-2">
        <div>
          <label for="lookup-ref">Reference Code</label>
          <input id="lookup-ref" type="text" placeholder="e.g. BK-8A4K2M" />
        </div>
        <div style="display: flex; align-items: end;">
          <button type="button" class="btn-primary" id="lookup-btn" style="width: 100%;">Find Booking</button>
        </div>
      </div>
      <p id="lookup-status" class="muted" style="margin-top: 0.6rem;"></p>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "demo_client_bookings_v1";

    const viewBook = document.getElementById("view-book");
    const viewMy = document.getElementById("view-my");
    const tabBookBtn = document.getElementById("tab-book-btn");
    const tabMyBtn = document.getElementById("tab-my-btn");
    const form = document.getElementById("booking-form");
    const confBox = document.getElementById("confirmation-box");
    const savedList = document.getElementById("saved-bookings-list");
    const lookupRef = document.getElementById("lookup-ref");
    const lookupBtn = document.getElementById("lookup-btn");
    const lookupStatus = document.getElementById("lookup-status");

    function showView(name) {
      const isMy = name === "my";
      viewBook.classList.toggle("hidden", isMy);
      viewMy.classList.toggle("hidden", !isMy);
      if (isMy) renderSavedBookings();
    }

    function loadBookings() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveBookings(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function makeRef() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "BK-";
      for (let i = 0; i < 6; i += 1) {
        code += chars[Math.floor(Math.random() * chars.length)];
      }
      return code;
    }

    function renderSavedBookings(filterRef = "") {
      const items = loadBookings();
      const filtered = filterRef
        ? items.filter((item) => item.ref.toUpperCase() === filterRef.toUpperCase())
        : items;

      if (!filtered.length) {
        savedList.innerHTML = `<p class="muted">No matching bookings found yet.</p>`;
        return;
      }

      savedList.innerHTML = filtered
        .map(
          (b) => `
          <div class="booking-item">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem;">
              <strong>${b.ref} — ${b.packageName}</strong>
              <span class="badge">${b.status}</span>
            </div>
            <div class="muted" style="margin-top:0.35rem; margin-bottom:0;">
              Client: ${b.clientName} (${b.clientPhone})<br />
              Date &amp; Time: ${b.eventDate} at ${b.startTime}<br />
              Venue: ${b.venue} • Estimated: RM ${Number(b.price).toFixed(2)}
            </div>
          </div>`
        )
        .join("");
    }

    tabBookBtn.addEventListener("click", () => showView("book"));
    tabMyBtn.addEventListener("click", () => showView("my"));

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const [packageName, price] = document.getElementById("package-select").value.split("|");
      const entry = {
        ref: makeRef(),
        status: "Pending Approval",
        clientName: document.getElementById("client-name").value.trim(),
        clientPhone: document.getElementById("client-phone").value.trim(),
        packageName,
        price: Number(price || 0),
        eventDate: document.getElementById("event-date").value,
        startTime: document.getElementById("start-time").value,
        venue: document.getElementById("venue").value.trim(),
        notes: document.getElementById("notes").value.trim()
      };

      const existing = loadBookings();
      existing.unshift(entry);
      saveBookings(existing);

      confBox.classList.remove("hidden");
      confBox.innerHTML = `
        <strong>Request Saved!</strong><br />
        Reference: <strong>${entry.ref}</strong> (${entry.status})<br />
        ${entry.packageName} on ${entry.eventDate} at ${entry.startTime} — ${entry.venue}
      `;
      form.reset();
    });

    lookupBtn.addEventListener("click", () => {
      const code = lookupRef.value.trim().toUpperCase();
      lookupStatus.textContent = code ? `Showing results for ${code}.` : "Showing all bookings saved on this browser.";
      renderSavedBookings(code);
    });
  </script>
</body>
</html>
